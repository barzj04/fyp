<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imbalance weight mount</title>
<style>
  :root{
    --bg:#faf8f5;
    --fg:#2b2823;
    --muted:#6b665c;
    --accent:#c2410c;
    --panel:#ffffff;
    --panel-border:#d8d2c6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17;
      --fg:#ecE8e0;
      --muted:#a39c8e;
      --accent:#ff8a4c;
      --panel:#24211d;
      --panel-border:#3a352d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17;
    --fg:#ecE8e0;
    --muted:#a39c8e;
    --accent:#ff8a4c;
    --panel:#24211d;
    --panel-border:#3a352d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-inline:16px;
    background:var(--bg);
    color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex;
    justify-content:center;
  }
  figure{
    margin:0;
    max-width:900px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:20px 22px 18px;
  }
  h1{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
  }
  .sub{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 14px;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    color:var(--fg);
  }
  figcaption{
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
    margin-top:12px;
    border-top:1px solid var(--panel-border);
    padding-top:10px;
  }
  text{ font-family:inherit; fill:currentColor; }
  .accent{ color:var(--accent); }
  .lbl{ font-size:12px; }
  .lbl-sm{ font-size:10.5px; }
  .muted-line{ color:var(--muted); }
</style>
</head>
<body>
<figure>
  <h1>Where to mount the offset weight</h1>
  <p class="sub">Hose clamp on the workpiece rod &mdash; not the chuck jaws</p>

  <svg viewBox="0 0 960 540" role="img" aria-label="A hose clamp with an offset fishing weight is mounted on the workpiece rod, clear of the chuck jaws and guard; an end-on view shows the weight sitting at a radius r from the spindle axis, which is what produces the simulated imbalance.">

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
      </marker>
    </defs>

    <!-- ============ SIDE VIEW ============ -->
    <text x="60" y="34" class="lbl muted-line" style="letter-spacing:.04em;">SIDE VIEW &mdash; along the machine</text>

    <!-- spindle axis -->
    <line x1="40" y1="150" x2="860" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="2 5" opacity="0.55"/>
    <text x="44" y="70" class="lbl-sm muted-line">spindle axis</text>

    <!-- rotation arrow around chuck -->
    <path d="M 100 66 A 84 84 0 0 1 178 66" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="139" y="54" class="lbl-sm muted-line" text-anchor="middle">rotation</text>

    <!-- chuck body -->
    <rect x="60" y="70" width="160" height="160" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <!-- jaw ticks where it grips the rod -->
    <line x1="200" y1="96"  x2="222" y2="102" stroke="currentColor" stroke-width="2"/>
    <line x1="200" y1="150" x2="222" y2="150" stroke="currentColor" stroke-width="2"/>
    <line x1="200" y1="204" x2="222" y2="198" stroke="currentColor" stroke-width="2"/>
    <text x="140" y="155" class="lbl" text-anchor="middle">3-jaw</text>
    <text x="140" y="171" class="lbl" text-anchor="middle">chuck</text>

    <!-- rod -->
    <rect x="220" y="137" width="600" height="26" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="640" y="120" class="lbl muted-line" text-anchor="middle">test rod (workpiece), chucked and extending outward</text>

    <!-- clearance dimension from chuck face to clamp -->
    <line x1="222" y1="255" x2="222" y2="270" stroke="currentColor" stroke-width="1"/>
    <line x1="500" y1="255" x2="500" y2="270" stroke="currentColor" stroke-width="1"/>
    <line x1="222" y1="263" x2="500" y2="263" stroke="currentColor" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="361" y="283" class="lbl-sm muted-line" text-anchor="middle">clear of the jaws &amp; chuck guard &mdash; a few cm out</text>

    <!-- clamp band -->
    <rect x="500" y="118" width="26" height="64" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <text x="513" y="205" class="lbl" text-anchor="middle">hose clamp</text>
    <text x="513" y="220" class="lbl" text-anchor="middle">(jubilee clip)</text>

    <!-- tie from clamp to weight -->
    <line x1="513" y1="118" x2="513" y2="100" stroke="var(--accent)" stroke-width="1.6"/>

    <!-- weight -->
    <circle cx="513" cy="86" r="15" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <text x="600" y="70" class="lbl accent" text-anchor="start">fishing weight, wired through</text>
    <text x="600" y="86" class="lbl accent" text-anchor="start">its own factory hole &mdash; no drilling</text>
    <line x1="528" y1="83" x2="598" y2="72" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- ============ END-ON VIEW ============ -->
    <rect x="650" y="330" width="270" height="200" rx="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="665" y="352" class="lbl muted-line" style="letter-spacing:.04em;">END VIEW &mdash; looking along the rod</text>

    <!-- rotation arrow -->
    <path d="M 830 400 A 46 46 0 0 1 800 442" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="845" y="415" class="lbl-sm muted-line">rotation</text>

    <!-- rod cross-section -->
    <circle cx="785" cy="430" r="40" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <!-- clamp ring -->
    <circle cx="785" cy="430" r="46" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- spindle centre -->
    <circle cx="785" cy="430" r="2.4" fill="currentColor"/>
    <text x="785" y="460" class="lbl-sm muted-line" text-anchor="middle">spindle axis</text>

    <!-- radius arrow -->
    <line x1="785" y1="430" x2="785" y2="386" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
    <text x="774" y="405" class="lbl accent" text-anchor="end">r</text>

    <!-- weight on ring -->
    <circle cx="785" cy="384" r="9" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="2"/>

    <text x="705" y="500" class="lbl-sm accent">r is what creates the imbalance &mdash;</text>
    <text x="705" y="514" class="lbl-sm accent">small r + more mass works just as well, and is safer</text>

  </svg>

  <figcaption>
    A hose clamp wraps fully around the test rod a few centimetres clear of the chuck jaws and guard. The fishing weight&rsquo;s own line-hole is wired to one side of the clamp band &mdash; no drilling into the rod, chuck, or weight. The end-on view shows why this works: the vibration signature comes from the weight sitting at radius <tspan class="accent">r</tspan> off the spindle axis, not from its mass alone, so a smaller, safer radius can be offset with a slightly heavier weight to hit the same target unbalance.
  </figcaption>
</figure>
</body>
</html>
