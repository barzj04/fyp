<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radius vs force</title>
<style>
  :root{
    --bg:#faf8f5;
    --fg:#2b2823;
    --muted:#6b665c;
    --accent:#c2410c;
    --panel:#ffffff;
    --panel-border:#d8d2c6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17; --fg:#ecE8e0; --muted:#a39c8e; --accent:#ff8a4c;
      --panel:#24211d; --panel-border:#3a352d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17; --fg:#ecE8e0; --muted:#a39c8e; --accent:#ff8a4c;
    --panel:#24211d; --panel-border:#3a352d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    padding-inline:16px;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex; justify-content:center;
  }
  figure{
    margin:0; max-width:820px; width:100%;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:20px 22px 18px;
  }
  h1{ font-size:15px; font-weight:600; margin:0 0 2px; }
  .sub{ font-size:12.5px; color:var(--muted); margin:0 0 14px; }
  svg{ display:block; width:100%; height:auto; color:var(--fg); }
  figcaption{
    font-size:12.5px; line-height:1.55; color:var(--muted);
    margin-top:12px; border-top:1px solid var(--panel-border); padding-top:10px;
  }
  text{ font-family:inherit; fill:currentColor; }
  .lbl{ font-size:12.5px; }
  .lbl-sm{ font-size:10.5px; }
  .accent{ color:var(--accent); }
  .muted-line{ color:var(--muted); }
  .big{ font-size:20px; font-weight:700; }
</style>
</head>
<body>
<figure>
  <h1>Same mass, same speed &mdash; only the radius changes</h1>
  <p class="sub">F = m &middot; r &middot; &omega;&sup2; &mdash; force grows in a straight line with r</p>

  <svg viewBox="0 0 900 460" role="img" aria-label="Two end-on views of the same weight and rotation speed: at a small radius the weight traces a small circle and produces a small force; moved further from the spindle axis at the same speed, it traces a much larger circle and produces a proportionally larger force.">

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
      </marker>
    </defs>

    <!-- ===== LEFT: SMALL RADIUS ===== -->
    <text x="225" y="34" class="lbl muted-line" text-anchor="middle" style="letter-spacing:.04em;">SMALL RADIUS</text>

    <!-- swept path (dashed) -->
    <circle cx="225" cy="230" r="40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <!-- rod cross-section -->
    <circle cx="225" cy="230" r="26" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <!-- axis -->
    <circle cx="225" cy="230" r="2.4" fill="currentColor"/>
    <text x="225" y="285" class="lbl-sm muted-line" text-anchor="middle">spindle axis</text>

    <!-- radius arrow -->
    <line x1="225" y1="230" x2="225" y2="192" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="234" y="212" class="lbl accent">r (small)</text>

    <!-- weight -->
    <circle cx="225" cy="190" r="10" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="2"/>

    <!-- rotation -->
    <path d="M 268 205 A 44 44 0 0 1 250 262" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="275" y="240" class="lbl-sm muted-line">same &omega;</text>

    <text x="225" y="340" class="lbl-sm muted-line" text-anchor="middle">weight close to centre &rarr;</text>
    <text x="225" y="356" class="lbl-sm muted-line" text-anchor="middle">small swept circle</text>
    <text x="225" y="400" class="big accent" text-anchor="middle">F = small</text>

    <!-- divider -->
    <line x1="450" y1="30" x2="450" y2="420" stroke="currentColor" stroke-width="1" stroke-dasharray="2 5" opacity="0.35"/>

    <!-- ===== RIGHT: LARGE RADIUS ===== -->
    <text x="675" y="34" class="lbl muted-line" text-anchor="middle" style="letter-spacing:.04em;">LARGER RADIUS</text>

    <!-- swept path (dashed), bigger -->
    <circle cx="675" cy="230" r="95" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <!-- rod cross-section -->
    <circle cx="675" cy="230" r="26" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <!-- axis -->
    <circle cx="675" cy="230" r="2.4" fill="currentColor"/>
    <text x="675" y="285" class="lbl-sm muted-line" text-anchor="middle">spindle axis</text>

    <!-- radius arrow, longer -->
    <line x1="675" y1="230" x2="675" y2="137" stroke="var(--accent)" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="686" y="175" class="lbl accent">r (large)</text>

    <!-- weight, same size (same mass) -->
    <circle cx="675" cy="135" r="10" fill="var(--accent)" opacity="0.35" stroke="var(--accent)" stroke-width="2.4"/>

    <!-- rotation -->
    <path d="M 748 165 A 98 98 0 0 1 705 320" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="755" y="245" class="lbl-sm muted-line">same &omega;</text>

    <text x="675" y="340" class="lbl-sm muted-line" text-anchor="middle">weight moved further out &rarr;</text>
    <text x="675" y="356" class="lbl-sm muted-line" text-anchor="middle">much bigger swept circle</text>
    <text x="675" y="400" class="big accent" text-anchor="middle">F = much bigger</text>

  </svg>

  <figcaption>
    Same weight, same rotation speed, both circles &mdash; the only thing that changed is how far the weight sits from the spindle axis. Doubling the radius roughly doubles the force (F = m&middot;r&middot;&omega;&sup2;), so pushing the mount further out along the rod is a far more effective way to increase the vibration signal than adding more grams at the same spot.
  </figcaption>
</figure>
</body>
</html>
